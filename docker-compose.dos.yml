# docker-compose.dos.yml
#
# DOS-specific override for agentic-whatsapp. Use with:
#
#   docker compose -f docker-compose.yml -f docker-compose.dos.yml up -d --build
#
# Changes from the base compose:
#   - Container name -> agentic-whatsapp-dos (so it doesn't clash with the SO container)
#   - Image name     -> agentic-whatsapp-dos:latest (separate image tag)
#   - Host port      -> 3057 (SO uses 3056)
#   - PORT env var   -> 3057 (so the server + healthcheck agree)
#
# Everything else (build context, env_file, volumes, capabilities) is inherited
# from docker-compose.yml — no duplication needed.
#
# Port-mapping note: docker-compose MERGES port lists across overrides. We
# declare ports here in long-form so the override REPLACES (rather than
# augments) the base 3056 mapping — otherwise the DOS container would try to
# also bind 3056, which clashes with the running SO container.
services:
  whatsapp:
    container_name: agentic-whatsapp-dos
    image: agentic-whatsapp-dos:latest
    ports:
      - target: 3057
        published: "3057"
        protocol: tcp
        mode: ingress
    environment:
      - PORT=3057
