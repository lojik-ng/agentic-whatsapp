services:
  whatsapp:
    container_name: agentic-whatsapp
    build:
      context: .
      dockerfile: Dockerfile
    image: agentic-whatsapp:latest
    restart: always
    # Both 3056 (SO) and 3057 (DOS) are exposed by default so the DOS override
    # can use 3057 without conflict. The PORT env var (set per-override below)
    # controls which the server actually listens on. In production only one
    # port is bound per container.
    ports:
      - "3056:3056"
      - "3057:3057"
    environment:
      - PORT=3056
      - DATA_DIR=/usr/src/app/data
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome-stable
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      - ./whatsapp-data:/usr/src/app/data
    # Recent Docker images of chromium-based clients need a few capabilities & shm size
    shm_size: '1gb'
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE

